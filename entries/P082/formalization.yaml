    "divergences": "Condition (13) is formalized with ideal membership included in the zero-divisor alternative, over the real extension of the literal steady-state ideal (the manuscript's Z_i). The necessity declaration asserts only that the positive candidate is not unique; the manuscript's classification Z_A = {2,3} (including that 2 is a candidate) is not part of the statement. The sufficiency declaration asserts uniqueness of the positive candidate but does not name its value (manuscript: 1). For Conjecture 4.7, the refuting order is given by explicit order axioms on exponents of three variables rather than a Mathlib MonomialOrder; that it satisfies the source's definition of an elimination order is the correspondence of those axioms, and that it is not a block order is visible from its definition (t-degree is compared before the u-degree tie-break) rather than a proved clause. The algorithm's output is an exact root-set predicate, not a verified basis-computation or root-isolation program. The completeness theorem is the implication (nonvacuous ACR value and zero-divisor value) => algorithmic candidate; it assumes the Groebner-basis property through BlockCompatible, leading-cover and membership hypotheses, covers real values only (the manuscript's extension-field form of Theorem 5.1 and Corollary 5.2 is not selected), allows arbitrary rational rates, and in the univariate case refers to the univariate basis element selected by choice. It corresponds to Corollary 5.2 in its real-valued form; the injectivity statement of Theorem 5.1 itself is not a selected declaration. Seven proof files use target-toolchain coefficient-API adaptations whose preservation of meaning is not yet verified."
