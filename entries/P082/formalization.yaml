  "status": {
    "scope": "Four selected declarations. (1) An explicit bimolecular five-reaction network has nonvacuous ACR in species A with value 2 but no unique positive coordinate candidate. (2) An explicit bimolecular seven-reaction network has a positive steady state and a unique positive coordinate candidate for A but no ACR value. (3) For an explicit bimolecular four-reaction network with ACR value 1 and a zero-divisor witness, an explicitly axiomatized elimination order (not a block order) with a certified reduced Gröbner basis makes the candidate algorithm omit 1. (4) For rational-rate mass-action input, a block-compatible monomial order and a family of ideal elements with the leading-cover property, every real nonvacuous ACR value that is a coordinate candidate of the real steady-state ideal is returned by the block algorithm. The Gröbner-basis property is a hypothesis; the algorithm is not a verified basis or root-isolation program, and candidates need not be ACR values.",
