    "scope": "Four selected declarations over the literal mass-action model: Reaction n has stoichiometric source and target vectors in N^n and a rational rate; Bimolecular r means source and target molecularity at most 2 and positive rate; steadyIdeal is the ideal of R[x] spanned by the field components (not saturated or radicalized); NonvacuousACR rs i alpha means some positive steady state exists and every positive steady state has x_i = alpha; a coordinate candidate (CoordinateCandidate, CoordinateCandidate4, SpeciesCoordinateCandidate) means X_i - C alpha lies in the real ideal or annihilates an element outside it. (1) question313_necessity_counterexample: the five-reaction network A+B->2B, B->A, B->C, A+C->2C (rate 1), C->A (rate 3) is bimolecular, has NonvacuousACR in A with value 2, and there is no unique alpha > 0 that is a coordinate candidate for A. (2) question313_sufficiency_counterexample: the seven-reaction network 2A->A+C, C->A+D, D->A+B, A+B->B, B->A+B, A->0 (rate 1), 2B->0 (rate 1/2) is bimolecular, has a positive steady state and a unique positive coordinate candidate for A, and no ACR value in A. (3) OrderWitness.unrestricted_order_counterexample: MixedLT on exponents of (u, v, t) compares u+v degree, then t degree, then u degree; it satisfies the explicit AdmissibleEliminationOrder axioms (well-founded strict total order, translation invariant, 0 minimal, leading exponent of z-degree 0 forces a pure-t polynomial); the rational steady ideal of U+T->T, V->U+V, U->U+V, V+T->T is <u^2-v^2, ut-v, vt-u> with a certified reduced basis for MixedLT; the network is bimolecular with NonvacuousACR in t with value 1; t-1 is a proper zero divisor modulo the real ideal; and AlgorithmCandidates {b1,b2,b3} 1 fails (candidates: positive roots of a pure-t basis element if one exists, else of the graded z-leading coefficients in Q[t]). (4) mass_action_block_algorithm_complete: for any n, species identification Fin n = Option sigma with t = none, monomial orders ful